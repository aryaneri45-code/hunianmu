<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Admin - HunianMu Workspace</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#132338',
              dark: '#0B1522',
              surface: '#F8FAFC',
              emerald: '#25D366',
              greenDark: '#128C7E',
              blue: '#2563EB',
              muted: '#64748B',
              border: '#E2E8F0'
            }
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .mesh-gradient {
      background-color: #0d1726;
      background-image: 
        radial-gradient(at 10% 20%, rgba(37, 99, 235, 0.25) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(37, 211, 102, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(19, 35, 56, 0.9) 0px, transparent 70%);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 antialiased selection:bg-brand-emerald selection:text-white">
<!-- Background Canvas Decoration -->
<div class="fixed inset-0 mesh-gradient pointer-events-none z-0"></div>
<div class="fixed inset-0 opacity-10 bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:24px_24px] pointer-events-none z-0"></div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-md mx-auto my-8">
<!-- Ambient background glow behind card -->
<div class="absolute -top-16 -left-16 w-56 h-56 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-16 -right-16 w-56 h-56 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none"></div>
<!-- Card Wrapper -->
<div class="relative bg-white rounded-3xl shadow-2xl shadow-black/40 border border-slate-700/40 p-8 sm:p-10">
<!-- Header: Logo & Badge -->
<div class="flex flex-col items-center text-center mb-8">
<div class="flex items-center gap-2.5 mb-3">
<img alt="HunianMu Logo" class="h-7 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBZJrQX1ckJhnITRYNOYMkN37WliizGAStk0pCu07ELPQ0rFSJFizNgqzCPpUS6B83aykemo3FOGu0tQ_IVLbSSbMrc5xHJqg2g0ijjZ3CVqpVuOi8fTM8BSGEyMgb6UotpA6xgAZFsw9gXNarPCc731G1QMTZJeyr0AaY2F1ibVUgmLBEMR4-wdocqpT2My2rtBWiSHPB0PnL84zsuW9f7N-lvWh3YgW71xVIZHRy89h0tLvH9y4El"/>
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase bg-[#132338]/10 text-[#132338] border border-[#132338]/15">
          Admin Portal
        </span>
</div>
<h1 class="text-2xl font-bold text-slate-900 tracking-tight">Masuk ke Panel Admin</h1>
<p class="text-xs text-slate-500 mt-1 max-w-xs">Kelola listing dan leads WhatsApp HunianMu</p>
</div>
<!-- Login Form -->
<form action="/admin" class="space-y-4" method="GET" onsubmit="event.preventDefault(); window.location.href='#';">
<!-- Email Input -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1.5" for="admin-email">
          Email Administrator
        </label>
<div class="relative rounded-xl border border-slate-200 bg-slate-50/60 focus-within:border-[#132338] focus-within:bg-white focus-within:ring-2 focus-within:ring-[#132338]/10 transition-all">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<i class="fa-regular fa-envelope text-sm"></i>
</div>
<input class="w-full pl-10 pr-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 bg-transparent rounded-xl focus:outline-none" id="admin-email" name="email" placeholder="nama@hunianmu.id" required="" type="email" value="bima.pratama@hunianmu.id"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block text-xs font-semibold text-slate-700" for="admin-password">
            Kata Sandi
          </label>
<a class="text-xs font-medium text-slate-500 hover:text-blue-600 transition-colors" href="#">
            Lupa kata sandi?
          </a>
</div>
<div class="relative rounded-xl border border-slate-200 bg-slate-50/60 focus-within:border-[#132338] focus-within:bg-white focus-within:ring-2 focus-within:ring-[#132338]/10 transition-all">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<i class="fa-solid fa-lock text-sm"></i>
</div>
<input class="w-full pl-10 pr-11 py-2.5 text-sm text-slate-800 placeholder-slate-400 bg-transparent rounded-xl focus:outline-none" id="admin-password" name="password" placeholder="••••••••••••" required="" type="password" value="••••••••••••"/>
<button aria-label="Lihat kata sandi" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors" onclick="const p = document.getElementById('admin-password'); const i = this.querySelector('i'); if(p.type === 'password'){ p.type = 'text'; i.classList.replace('fa-eye-slash', 'fa-eye'); } else { p.type = 'password'; i.classList.replace('fa-eye', 'fa-eye-slash'); }" type="button">
<i class="fa-regular fa-eye-slash text-sm"></i>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="pt-1 flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer select-none text-xs text-slate-600 font-medium">
<input checked="" class="w-4 h-4 rounded text-[#132338] focus:ring-[#132338]/30 border-slate-300 transition" type="checkbox"/>
<span>Ingat saya di perangkat ini</span>
</label>
</div>
<!-- Submit Button -->
<button class="w-full mt-2 py-3 px-5 rounded-xl font-semibold text-sm text-white bg-gradient-to-r from-[#132338] to-[#1e3a5f] hover:from-[#0d1726] hover:to-[#172e4c] active:scale-[0.99] transition-all shadow-lg shadow-[#132338]/20 flex items-center justify-center gap-2 group cursor-pointer" type="submit">
<span>Masuk ke Dashboard</span>
<i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-0.5 transition-transform"></i>
</button>
</form>
<!-- Bottom Links -->
<div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
<a class="inline-flex items-center gap-1.5 hover:text-slate-800 transition-colors" href="#">
<i class="fa-solid fa-arrow-left text-[10px]"></i>
<span>Kembali ke Beranda Website</span>
</a>
<a class="inline-flex items-center gap-1 text-emerald-600 font-semibold hover:text-emerald-700 transition-colors" href="https://wa.me/6281234567890?text=Halo%20Admin%20IT%20HunianMu,%20saya%20mengalami%20kendala%20login%20workspace" target="_blank">
<i class="fa-brands fa-whatsapp text-sm"></i>
<span>Bantuan WhatsApp</span>
</a>
</div>
</div>
</main>
</body></html>
